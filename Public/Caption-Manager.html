<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BKK Property Finder — Caption Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --navy-mid: #162233;
    --navy-light: #1e2f42;
    --gold: #c8973a;
    --gold-light: #e0b864;
    --gold-pale: #f5e8cc;
    --cream: #faf8f4;
    --text: #1a1a2e;
    --muted: #6b7c93;
    --border: rgba(200,151,58,0.2);
    --card-shadow: 0 2px 16px rgba(13,27,42,0.10);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(13,27,42,0.4);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .logo-mark {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--navy);
    flex-shrink: 0;
    letter-spacing: -0.5px;
  }

  .header-title h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    letter-spacing: 0.3px;
  }

  .header-title p {
    font-size: 11px;
    color: var(--gold);
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .listing-count {
    margin-left: auto;
    background: rgba(200,151,58,0.15);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--gold-light);
    font-weight: 600;
    white-space: nowrap;
  }

  /* ── SEARCH ── */
  .search-wrap {
    position: relative;
    margin-bottom: 10px;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: var(--navy-mid);
    border: 1px solid rgba(200,151,58,0.25);
    border-radius: 10px;
    padding: 11px 14px 11px 38px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: #fff;
    outline: none;
    transition: border-color 0.2s;
  }

  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--gold); }

  .clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    display: none;
    padding: 2px;
    line-height: 1;
  }

  /* ── FILTERS ── */
  .filters {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    background: var(--navy-mid);
    border: 1px solid rgba(200,151,58,0.2);
    border-radius: 20px;
    color: var(--muted);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .filter-btn:hover {
    border-color: var(--gold);
    color: var(--gold-light);
  }

  .filter-btn.active {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-color: transparent;
    color: var(--navy);
    font-weight: 600;
  }

  /* ── GRID ── */
  .container {
    padding: 16px 14px 100px;
  }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .no-results .emoji { font-size: 36px; margin-bottom: 12px; }
  .no-results p { font-size: 15px; }

  /* ── CARDS ── */
  .grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    border: 1px solid rgba(13,27,42,0.06);
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .card:active { transform: scale(0.985); }

  .card-inner {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bpf-badge {
    background: var(--navy);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
    flex-shrink: 0;
    min-width: 64px;
  }

  .bpf-badge .code {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    letter-spacing: 0.5px;
    display: block;
  }

  .bpf-badge .year {
    font-size: 10px;
    color: var(--muted);
    font-weight: 400;
    display: block;
    margin-top: 2px;
  }

  .card-info { flex: 1; min-width: 0; }

  .card-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .status-pill {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .status-rent {
    background: #e8f5ee;
    color: #2e7d52;
  }

  .status-sale {
    background: #fff3e0;
    color: #b36a00;
  }

  .status-both {
    background: #ede7f6;
    color: #5c35b0;
  }

  .card-price {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  .card-arrow {
    color: var(--gold);
    font-size: 16px;
    flex-shrink: 0;
    opacity: 0.7;
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13,27,42,0.72);
    z-index: 200;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }

  .modal-overlay.open { display: flex; align-items: flex-end; }

  .modal {
    background: #fff;
    border-radius: 22px 22px 0 0;
    width: 100%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.3s cubic-bezier(0.34, 1.26, 0.64, 1);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 12px auto 0;
    flex-shrink: 0;
  }

  .modal-header {
    padding: 14px 18px 12px;
    border-bottom: 1px solid rgba(13,27,42,0.07);
    flex-shrink: 0;
  }

  .modal-title-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }

  .modal-bpf {
    background: var(--navy);
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .modal-property-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.2;
    flex: 1;
  }

  .modal-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .modal-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0;
  }

  .caption-tabs {
    display: flex;
    border-bottom: 1px solid rgba(13,27,42,0.08);
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 10;
  }

  .tab-btn {
    flex: 1;
    padding: 12px;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .tab-btn.active {
    color: var(--navy);
    border-bottom-color: var(--gold);
    font-weight: 600;
  }

  .tab-content {
    display: none;
    padding: 16px 18px;
  }

  .tab-content.active { display: block; }

  .caption-text {
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'DM Sans', sans-serif;
  }

  .hashtags {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(13,27,42,0.07);
    font-size: 12px;
    color: var(--gold);
    word-break: break-word;
    line-height: 1.8;
    font-weight: 500;
  }

  .modal-footer {
    padding: 14px 18px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(13,27,42,0.07);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    background: #fff;
  }

  .copy-btn {
    flex: 1;
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: var(--gold-light);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .copy-btn.copied {
    background: linear-gradient(135deg, #2e7d52, #3a9966);
    color: #fff;
  }

  .copy-btn-both {
    flex: 1;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--navy);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .copy-btn-both.copied {
    background: linear-gradient(135deg, #2e7d52, #3a9966);
    color: #fff;
  }

  .close-modal {
    width: 46px;
    height: 46px;
    background: rgba(13,27,42,0.06);
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy);
    color: var(--gold-light);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
    border: 1px solid var(--border);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo-mark">BKK</div>
    <div class="header-title">
      <h1>BKK Property Finder</h1>
      <p>Caption Manager</p>
    </div>
    <div class="listing-count" id="listingCount">32 listings</div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search by code or property name…" autocomplete="off" spellcheck="false">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter(this)">All</button>
    <button class="filter-btn" data-filter="rent" onclick="setFilter(this)">For Rent</button>
    <button class="filter-btn" data-filter="sale" onclick="setFilter(this)">For Sale</button>
    <button class="filter-btn" data-filter="both" onclick="setFilter(this)">Rent &amp; Sale</button>
  </div>
</header>

<div class="container">
  <div class="grid" id="grid"></div>
  <div class="no-results" id="noResults" style="display:none;">
    <div class="emoji">🏙️</div>
    <p>No listings match your search.</p>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title-row">
        <span class="modal-bpf" id="modalCode"></span>
        <div class="modal-property-name" id="modalName"></div>
      </div>
      <div class="modal-pills" id="modalPills"></div>
    </div>
    <div class="modal-body">
      <div class="caption-tabs">
        <button class="tab-btn active" onclick="switchTab('en', this)">🇬🇧 English</button>
        <button class="tab-btn" onclick="switchTab('th', this)">🇹🇭 Thai</button>
        <button class="tab-btn" onclick="switchTab('both', this)">Both</button>
      </div>
      <div class="tab-content active" id="tab-en">
        <div class="caption-text" id="captionEn"></div>
        <div class="hashtags" id="hashtagsEn"></div>
      </div>
      <div class="tab-content" id="tab-th">
        <div class="caption-text" id="captionTh"></div>
        <div class="hashtags" id="hashtagsTh"></div>
      </div>
      <div class="tab-content" id="tab-both">
        <div class="caption-text" id="captionBoth"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="copy-btn" id="copyVisible" onclick="copyVisible()">📋 Copy Caption</button>
      <button class="copy-btn-both" id="copyBoth" onclick="copyBoth()">✨ Copy Both</button>
      <button class="close-modal" onclick="closeModalDirect()">✕</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function genEN(p){

  const facs=_facs(p);
  const L=[p.title+" \u2014 "+(isRent?"For Rent":isSale?"For Sale":"For Rent / Sale"),"",specs.join(" | ")];
  if(extras.length)L.push(extras.join(" | "));
  if(facs.length)L.push("Facilities: "+facs.join(", "));

  return L.join("\n");
}

function genHashtags(p){
  const t=[]; const ty=(p.type||"Condo").replace(/\s/g,"");

  if(loc)t.push("#"+loc.replace(/\s/g,""));
  const st=_station(p); if(st)t.push("#"+st.replace(/\s/g,""));
  t.push("#\u0e04\u0e2d\u0e19\u0e42\u0e14\u0e01\u0e23\u0e38\u0e07\u0e40\u0e17\u0e1e","#Thailand","#bkkproperty.finder");
  return t.join(" ");

function toCaption(p){
  const ref=(p.ref||"").trim(); const code=ref?ref.split("/")[0]:"\u2014";
  const status=p.status==="For Sale"?"sale":(p.status==="For Rent"?"rent":"both");
  return { code, name:p.title||"Untitled", status, price:p.price||"", en:genEN(p), th:genTH(p), hashtags:genHashtags(p) };
}
async function loadListings(){
  const countEl=document.getElementById("listingCount"); if(countEl)countEl.textContent="Loading\u2026";
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/properties?select=*&order=created_at.desc",{headers:{apikey:SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const data=await r.json();
    const real=data.filter(p=>p.type!=="__city_photos__"&&p.type!=="__stats__"&&p.active!==false);
    LISTINGS=real.map(toCaption);
    render();
  }catch(e){ _demo=true; LISTINGS=DEMO_LISTINGS.map(toCaption); render(); }
}

// ── STATE ──
let currentFilter = "all";
let currentSearch = "";
let currentListing = null;
let activeTab = "en";

// ── RENDER ──
function getStatusLabel(status) {
  if (status === "rent") return { cls: "status-rent", label: "For Rent" };
  if (status === "sale") return { cls: "status-sale", label: "For Sale" };
  return { cls: "status-both", label: "Rent & Sale" };
}

function render() {
  const q = currentSearch.toLowerCase();
  const filtered = LISTINGS.filter(l => {
    const matchFilter = currentFilter === "all" || l.status === currentFilter;
    const matchSearch = !q || l.code.toLowerCase().includes(q) || l.name.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  document.getElementById("listingCount").textContent = filtered.length + " listing" + (filtered.length !== 1 ? "s" : "") + (_demo ? " · preview (your live listings load when online)" : "");
  const grid = document.getElementById("grid");
  const noResults = document.getElementById("noResults");

  if (filtered.length === 0) {
    grid.innerHTML = "";
    noResults.style.display = "block";
    return;
  }
  noResults.style.display = "none";

  grid.innerHTML = filtered.map(l => {
    const s = getStatusLabel(l.status);
    return `<div class="card" onclick="openModal('${l.code}')">
      <div class="card-inner">
        <div class="bpf-badge">
          <span class="code">${l.code}</span>
          <span class="year">2026</span>
        </div>
        <div class="card-info">
          <div class="card-name">${l.name}</div>
          <div class="card-meta">
            <span class="status-pill ${s.cls}">${s.label}</span>
            <span class="card-price">${l.price}</span>
          </div>
        </div>
        <span class="card-arrow">›</span>
      </div>
    </div>`;
  }).join("");
}

// ── FILTER ──
function setFilter(btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentFilter = btn.dataset.filter;
  render();
}

// ── SEARCH ──
document.getElementById("search").addEventListener("input", function() {
  currentSearch = this.value;
  document.getElementById("clearBtn").style.display = this.value ? "block" : "none";
  render();
});

function clearSearch() {
  document.getElementById("search").value = "";
  currentSearch = "";
  document.getElementById("clearBtn").style.display = "none";
  render();
}

// ── MODAL ──
function openModal(code) {
  currentListing = LISTINGS.find(l => l.code === code);
  if (!currentListing) return;

  document.getElementById("modalCode").textContent = code + "/2026";
  document.getElementById("modalName").textContent = currentListing.name;

  const s = getStatusLabel(currentListing.status);
  document.getElementById("modalPills").innerHTML =
    `<span class="status-pill ${s.cls}">${s.label}</span>
     <span class="card-price" style="font-size:13px;color:var(--muted)">${currentListing.price}</span>`;

  document.getElementById("captionEn").textContent = currentListing.en;
  document.getElementById("hashtagsEn").textContent = currentListing.hashtags;
  document.getElementById("captionTh").textContent = currentListing.th;
  document.getElementById("hashtagsTh").textContent = currentListing.hashtags;
  document.getElementById("captionBoth").textContent =
    currentListing.en + "\n\n─────────────────\n\n" + currentListing.th + "\n\n" + currentListing.hashtags;

  // Reset tab
  switchTab("en", document.querySelector(".tab-btn"));
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal(e) {
  if (e.target === document.getElementById("modalOverlay")) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function switchTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  if (btn) btn.classList.add("active");
  else document.querySelectorAll(".tab-btn")[tab === "en" ? 0 : tab === "th" ? 1 : 2].classList.add("active");
  document.getElementById("tab-" + tab).classList.add("active");
}

// ── COPY ──
function getVisibleText() {
  if (!currentListing) return "";
  if (activeTab === "en") return currentListing.en + "\n\n" + currentListing.hashtags;
  if (activeTab === "th") return currentListing.th + "\n\n" + currentListing.hashtags;
  return currentListing.en + "\n\n─────────────────\n\n" + currentListing.th + "\n\n" + currentListing.hashtags;
}

function copyVisible() {
  const text = getVisibleText();
  copyToClipboard(text, "copyVisible", "📋 Copied!");
}

function copyBoth() {
  if (!currentListing) return;
  const text = currentListing.en + "\n\n─────────────────\n\n" + currentListing.th + "\n\n" + currentListing.hashtags;
  copyToClipboard(text, "copyBoth", "✨ Both Copied!");
}

function copyToClipboard(text, btnId, successLabel) {
  const btn = document.getElementById(btnId);
  const original = btn.innerHTML;
  navigator.clipboard.writeText(text).then(() => {
    btn.innerHTML = "✓ " + successLabel;
    btn.classList.add("copied");
    showToast("✓ Copied to clipboard");
    setTimeout(() => {
      btn.innerHTML = original;
      btn.classList.remove("copied");
    }, 2200);
  }).catch(() => {
    // fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    btn.innerHTML = "✓ " + successLabel;
    btn.classList.add("copied");
    showToast("✓ Copied to clipboard");
    setTimeout(() => {
      btn.innerHTML = original;
      btn.classList.remove("copied");
    }, 2200);
  });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
